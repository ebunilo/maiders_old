<div class="modal-header">
  <h5 class="modal-title">Add Transaction</h5>
  <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
</div>
<form hx-post="/transactions/new" hx-target="#results" hx-swap="innerHTML">
  <div class="modal-body">
    <div class="row g-2">
      <div class="col-12 position-relative">
        <label class="form-label small">Customer Name</label>
        <input
          class="form-control form-control-sm"
          id="txn-customer-name"
          name="customer_name"
          autocomplete="off"
          required
          hx-get="/transactions/customer-lookup"
          hx-trigger="input changed delay:250ms"
          hx-target="#txn-customer-suggestions"
          hx-swap="innerHTML"
          oninput="document.getElementById('txn-customer-id').value=''"
          onblur="setTimeout(() => document.getElementById('txn-customer-suggestions').innerHTML='', 200)"
        >
        <input type="hidden" id="txn-customer-id" name="customer_id">
        <div id="txn-customer-suggestions" class="position-absolute w-100" style="z-index: 1056;"></div>
      </div>
      <div class="col-6">
        <label class="form-label small">Date</label>
        <input type="date" class="form-control form-control-sm" name="date_posted" required value="{{ today }}">
      </div>
      <div class="col-12">
        <label class="form-label small">Details</label>
        <input class="form-control form-control-sm" name="details">
      </div>
      <div class="col-6">
        <label class="form-label small">Amount Debit</label>
        <input type="number" step="0.01" class="form-control form-control-sm" name="amount_dr" value="0">
      </div>
      <div class="col-6">
        <label class="form-label small">Amount Credit</label>
        <input type="number" step="0.01" class="form-control form-control-sm" name="amount_cr" value="0">
      </div>
      <div class="col-6">
        <label class="form-label small">Payment Mode</label>
        <input class="form-control form-control-sm" name="payment_mode">
      </div>
      <div class="col-6">
        <label class="form-label small">Bank Name</label>
        <input class="form-control form-control-sm" name="bank_name">
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
    <button type="submit" class="btn btn-primary btn-sm" data-bs-dismiss="modal">Save Transaction</button>
  </div>
</form>
<script>
  function selectTxnCustomer(id, name) {
    document.getElementById('txn-customer-name').value = name;
    document.getElementById('txn-customer-id').value = id;
    document.getElementById('txn-customer-suggestions').innerHTML = '';
  }
</script>
