<div class="modal-header">
  <h5 class="modal-title">New Customer</h5>
  <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
</div>
<form hx-post="/customers/new" hx-target="#customerModalContent" hx-swap="innerHTML">
  <div class="modal-body">
    {% if error %}
    <div class="alert alert-danger py-2 small">{{ error }}</div>
    {% endif %}
    <div class="row g-2">
      <div class="col-12">
        <label class="form-label small">Code</label>
        <input class="form-control form-control-sm" name="code" value="{{ code }}" required autofocus>
      </div>
      <div class="col-12">
        <label class="form-label small">Name</label>
        <input class="form-control form-control-sm" name="name" value="{{ name }}" required>
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
    <button type="submit" class="btn btn-primary btn-sm">Save Customer</button>
  </div>
</form>
