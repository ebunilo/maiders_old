<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Customer Transactions Ledger{% endblock %}</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">Ledger</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link {% if active == 'dashboard' %}active fw-bold{% endif %}" href="/">Dashboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if active == 'customers' %}active fw-bold{% endif %}" href="/customers">Customers</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if active == 'transactions' %}active fw-bold{% endif %}" href="/transactions">Transactions</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if active == 'suppliers' %}active fw-bold{% endif %}" href="/suppliers">Suppliers</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if active == 'supplier_transactions' %}active fw-bold{% endif %}" href="/supplier-transactions">Supplier Transactions</a>
          </li>
        </ul>
        <span class="navbar-text text-light me-3 small">{{ request.session.get('username', '') }}</span>
        <a class="btn btn-outline-light btn-sm" href="/logout">Logout</a>
      </div>
    </div>
  </nav>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <main class="container-fluid py-4">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
