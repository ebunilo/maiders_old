name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Loads the deploy key into an SSH agent for the next step. A
      # Docker-based action (not Node), so it's unaffected by the
      # Node 20 runner deprecation.
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Ships the working tree to the server with rsync over SSH. The
      # server never needs its own git credentials/deploy key this way --
      # it only needs the SSH key above to accept the connection.
      - name: Sync code to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          rsync -avz --delete \
            --exclude=.git/ --exclude=.github/ --exclude=.venv/ --exclude=__pycache__/ --exclude=.env \
            -e "ssh -p $SSH_PORT" \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH"

      # Writes .env from secrets straight on the server (never touches the
      # runner's disk or the workflow log) and brings the stack up.
      - name: Write .env and deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          APP_PORT: ${{ secrets.APP_PORT }}
          WEB_CONCURRENCY: ${{ secrets.WEB_CONCURRENCY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: DEPLOY_PATH,POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,APP_PORT,WEB_CONCURRENCY,SECRET_KEY,ADMIN_USERNAME,ADMIN_PASSWORD
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"

            umask 077
            cat > .env <<ENVEOF
            POSTGRES_USER=$POSTGRES_USER
            POSTGRES_PASSWORD=$POSTGRES_PASSWORD
            POSTGRES_DB=$POSTGRES_DB
            APP_PORT=$APP_PORT
            WEB_CONCURRENCY=$WEB_CONCURRENCY
            SECRET_KEY=$SECRET_KEY
            ADMIN_USERNAME=$ADMIN_USERNAME
            ADMIN_PASSWORD=$ADMIN_PASSWORD
            ENVEOF

            docker compose up -d --build app
            docker image prune -f
